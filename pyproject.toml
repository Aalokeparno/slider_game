[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tabor"
version = "0.1.0"
description = "ELEC573: Slider Game / fraught states (Tabor, Smith & Dankowicz), OSF archive gvcpz"
requires-python = ">=3.9"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["slider", "slider.models"]

[tool.pyright]
extraPaths = ["src"]
